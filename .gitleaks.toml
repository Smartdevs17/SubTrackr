# Centralised Gitleaks configuration for SubTrackr
# Reference: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml

title = "SubTrackr Secret Scanning Rules"

[extend]
# Inherit the official Gitleaks default rule set
useDefault = true

# ---------------------------------------------------------------------------
# Project-specific rules (supplement the defaults)
# ---------------------------------------------------------------------------

[[rules]]
id          = "subtrackr-jwt-secret"
description = "Hard-coded JWT signing secret"
regex       = '''(?i)(jwt[_\-]?secret\s*[:=]\s*["']?)[A-Za-z0-9+/=]{32,}'''
tags        = ["secret", "jwt"]

[[rules]]
id          = "subtrackr-db-password"
description = "Database password in connection string"
regex       = '''postgres(?:ql)?://[^:]+:([^@]{8,})@'''
tags        = ["secret", "database"]
[rules.allowlist]
  regexes = ["localhost", "127\\.0\\.0\\.1", "\\$\\{[^}]+\\}", "\\$[A-Z_]+"]

[[rules]]
id          = "subtrackr-shopify-secret"
description = "Shopify webhook or app secret"
regex       = '''(?i)(shopify[_\-]?(webhook[_\-]?)?secret\s*[:=]\s*["']?)([a-f0-9]{32,64})'''
tags        = ["secret", "shopify"]

# ---------------------------------------------------------------------------
# Allowlist — paths that may contain test fixtures or example values
# ---------------------------------------------------------------------------

[allowlist]
description = "Suppress false positives from test fixtures and documentation"
paths = [
  ".gitleaks.toml",
  "**/*.test.ts",
  "**/*.spec.ts",
  "**/__tests__/**",
  "**/fixtures/**",
  "**/__mocks__/**",
  "**/*.example",
  "**/*.example.env",
  "docs/**",
]
regexes = [
  # Placeholder values used in documentation / README
  "your[_\\-]?(secret|token|key|password)",
  "INSERT[_\\-]?SECRET[_\\-]?HERE",
  "CHANGE[_\\-]?ME",
]
