title = "SubTrackr secret scanning configuration"

[extend]
useDefault = true

[allowlist]
description = "Allow test fixtures, documentation examples, demo UI placeholder credentials, and lockfiles to avoid noisy findings."
paths = [
    '''\.env\.example$''',
    '''.*\.test\.ts$''',
    '''.*\.test\.tsx$''',
    '''.*\.spec\.ts$''',
    '''.*\.spec\.tsx$''',
    '''.*/__tests__/.*''',
    '''.*/__mocks__/.*''',
    '''.*\.md$''',
    '''.*package-lock\.json$''',
    '''.*pnpm-lock\.yaml$''',
    '''.*yarn\.lock$''',
    '''.*Cargo\.lock$''',
    # Developer-portal demo screen: mock API-key fixtures rendered in the UI.
    # These are fake values in local state, never real credentials.
    '''developer-portal/pages/ApiKeysPage\.tsx$''',
]
# Literal placeholder tokens used in docs snippets and demo copy.
stopwords = [
    'YOUR_API_KEY',
    'YOUR_API_KEY_HERE',
    'sk_test_your_key',
]