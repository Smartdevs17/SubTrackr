[package]
name = "utils"
version = "0.1.0"
edition = "2021"
authors = ["SubTrackr Team"]
description = "Shared utilities for SubTrackr contracts (Soroban)"

[lib]
# lib only — no WASM binary; shared across workspace as a utility library
crate-type = ["lib"]

[dependencies]
soroban-sdk = { workspace = true }

[features]
default = []
testutils = ["soroban-sdk/testutils"]

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
