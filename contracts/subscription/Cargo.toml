[package]
name = "subtrackr-subscription"
version = "0.3.0"
edition = "2021"
authors = ["SubTrackr Team"]
description = "SubTrackr subscription implementation contract (Soroban)"

[lib]
name = "subtrackr_subscription"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
subtrackr-types = { path = "../types" }
subtrackr-oracle = { path = "../oracle", optional = true }

[features]
# ── Core feature (always compiled) ───────────────────────────────────────────
default = []

# ── Optional modules ─────────────────────────────────────────────────────────
# Activate oracle price-feed integration
oracle = ["dep:subtrackr-oracle"]

# Extended subscription features: revenue recognition, quota/usage, proration,
# payment methods.  Excluded from the minimal core binary.
extended = []

# Metering: usage-based billing hooks
metering = []

# Audit log: publish detailed on-chain audit events
audit-log = []

# Credit: credit memo / prepayment module
credit = []

# Fraud: fraud detection hooks integrated into charge flow
fraud = []

# Convenience alias — enables all optional modules
full = ["oracle", "extended", "metering", "audit-log", "credit", "fraud"]

# Test utilities — NEVER compiled into production WASM
testutils = ["soroban-sdk/testutils"]

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
