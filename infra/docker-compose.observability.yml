# Local observability stack for SubTrackr distributed tracing.
#
#   docker compose -f infra/docker-compose.observability.yml up
#
# Then point every service at the collector:
#   OTEL_EXPORTER_OTLP_ENDPOINT=https://localhost:4318
#
# Transport is TLS-only (#2104). Create the certificates once, in infra/tls/:
#   openssl req -x509 -newkey rsa:2048 -nodes -days 365 -subj "/CN=localhost" \
#     -addext "subjectAltName=DNS:localhost,DNS:otel-collector,DNS:tempo" \
#     -keyout server.key -out server.crt
#   cp server.crt ca.crt
# and open Grafana at http://localhost:3000 (Explore → Tempo) for flame graphs.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - ./tls:/etc/otel/tls:ro
    ports:
      - '4318:4318' # OTLP HTTP
      - '4317:4317' # OTLP gRPC
      - '13133:13133' # health check
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:latest
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - ./tls:/etc/tempo/tls:ro
    ports:
      - '3200:3200' # Tempo query

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    ports:
      - '3000:3000'
    depends_on:
      - tempo
