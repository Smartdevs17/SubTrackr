# Issue #1289: Implement horizontal autoscaling for API
#
# Horizontal scaling for the SubTrackr API. The HPA targets the
# subtrackr-api Deployment in api-deployment.yaml and scales on CPU and
# memory utilisation against the container's resource requests.
#
# Validate with:  node scripts/validate-autoscaling.js
# Apply with:     kubectl apply -f api-autoscaling.yaml
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: subtrackr-api
  namespace: subtrackr
  labels:
    app: subtrackr-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: subtrackr-api
  # 2 up / 8 down matches a 5.8x peak-to-trough ratio in production traffic.
  # The floor of 2 is what keeps a single node loss from taking the API fully
  # offline while the HPA is still waiting on its metrics window.
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      # React inside one metrics window so a burst is absorbed before the
      # request queue starts shedding load.
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      # Be slow to remove capacity. Re-adding a pod costs a cold start and a
      # re-warmed cache, so a flap is more expensive than running one extra
      # replica for a few minutes.
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: subtrackr-api
  namespace: subtrackr
  labels:
    app: subtrackr-api
spec:
  # Complements the HPA: a node drain or cluster upgrade must never evict the
  # last API pod, which is the failure mode that turns a rollout into an
  # outage.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: subtrackr-api
