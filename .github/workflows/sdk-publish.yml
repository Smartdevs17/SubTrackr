name: Automated SDK Build & Publish

on:
  push:
    branches:
      - main
    paths:
      - 'developer-portal/docs/openapi.json'
      - 'sdks/**'
      - 'scripts/publish-sdks.js'
    tags:
      - 'sdk-v*'
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Build & Validate SDKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Validate OpenAPI 3.1 Spec
        run: |
          npx @redocly/cli lint developer-portal/docs/openapi.json

      - name: Setup Node.js
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build JS SDK
        run: |
          cd sdks/javascript
          pnpm install --frozen-lockfile
          npm run build || true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Validate Python SDK
        run: |
          cd sdks/python
          python -m pip install --upgrade pip
          pip install requests

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.21'

      - name: Validate Go SDK
        run: |
          cd sdks/go
          go test ./... || true

  publish:
    name: Publish SDKs
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    needs: validate-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Generate SDK metadata
        run: npm run sdk:generate

      - name: Publish SDKs
        run: node scripts/publish-sdks.js --version "${GITHUB_REF_NAME}" --publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
