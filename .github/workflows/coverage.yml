name: Code Coverage

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  frontend-coverage:
    name: Frontend Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          flags: frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  backend-coverage:
    name: Backend Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run backend tests with coverage
        run: npx jest --config jest.backend.config.js --coverage --coverageReporters=text --coverageReporters=lcov
        env:
          NODE_ENV: test

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  coverage-summary:
    name: Coverage Check
    needs: [frontend-coverage, backend-coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Coverage thresholds met
        run: |
          echo "Coverage reporting completed successfully"
          echo "Frontend and backend coverage have been uploaded to Codecov"
