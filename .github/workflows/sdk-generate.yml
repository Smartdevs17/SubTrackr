name: SDK Auto-Generation

# Runs whenever the OpenAPI spec, its generator inputs, or committed SDK output change.
# Regeneration happens in CI and the PR fails if committed output differs from it.
on:
  push:
    branches:
      - main
    paths:
      - 'spec/openapi.yaml'
      - 'developer-portal/docs/openapi.json'
      - 'backend/services/shared/schemas.ts'
      - 'scripts/generate-openapi.ts'
      - 'scripts/generate-sdks.js'
      - 'scripts/sdk-generate.sh'
      - 'sdks/**'
      - '.github/workflows/sdk-generate.yml'
  pull_request:
    paths:
      - 'spec/openapi.yaml'
      - 'developer-portal/docs/openapi.json'
      - 'backend/services/shared/schemas.ts'
      - 'scripts/generate-openapi.ts'
      - 'scripts/generate-sdks.js'
      - 'scripts/sdk-generate.sh'
      - 'sdks/**'
      - '.github/workflows/sdk-generate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate OpenAPI spec
        uses: mbowman100/swagger-validator-action@v1
        with:
          files: spec/openapi.yaml
      - name: Check breaking changes
        uses: ponelat/oas-breaking-changes-action@v1
        with:
          spec-file: spec/openapi.yaml
          old-spec-file: docs/openapi.yaml

  generate-sdks:
    name: Regenerate ${{ matrix.language }} SDK
    needs: validate-spec
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, python, go]
    env:
      SDK_GEN_OUT: ${{ runner.temp }}/sdk-gen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # openapi-generator runs on the JVM
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
        if: matrix.language == 'python'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
        if: matrix.language == 'go'
      - name: Regenerate and verify ${{ matrix.language }} SDK matches committed output
        run: bash scripts/sdk-generate.sh ${{ matrix.language }} --check
      - name: Upload regenerated output when drift is found
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.language }}-regenerated
          path: ${{ runner.temp }}/sdk-gen/${{ matrix.language }}
          if-no-files-found: ignore

  endpoints-index:
    name: Verify sdks/generated/endpoints.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate endpoints index
        run: node scripts/generate-sdks.js
      - name: Fail if endpoints index is stale
        run: |
          if [ -n "$(git status --porcelain -- sdks/generated)" ]; then
            echo "sdks/generated is out of date. Run: node scripts/generate-sdks.js" >&2
            git --no-pager diff -- sdks/generated >&2
            exit 1
          fi
