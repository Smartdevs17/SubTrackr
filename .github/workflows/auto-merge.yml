name: Auto-Merge PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge PR if no conflicts
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            const { data: updated } = await github.rest.pulls.get({
              owner, repo, pull_number: pr.number,
            });

            if (updated.mergeable !== true) {
              console.log(`PR #${pr.number} not mergeable (mergeable=${updated.mergeable}); skipping.`);
              return;
            }

            try {
              await github.rest.pulls.merge({
                owner, repo, pull_number: pr.number,
                merge_method: 'squash',
              });
              console.log(`Merged PR #${pr.number}`);
            } catch (e) {
              console.log(`Could not merge PR #${pr.number}: ${e.message}`);
            }