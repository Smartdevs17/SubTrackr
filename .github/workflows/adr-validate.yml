name: Validate ADR

on:
  pull_request:
    paths:
      - 'docs/adr/**'

jobs:
  validate-adr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ADR sections
        run: |
          for f in docs/adr/*.md; do
            grep -q '^## Estado' "$f" || { echo "FALTA: ## Estado en $f"; exit 1; }
            grep -q '^## Contexto' "$f" || { echo "FALTA: ## Contexto en $f"; exit 1; }
            grep -q '^## Decisión' "$f" || { echo "FALTA: ## Decisión en $f"; exit 1; }
          done
          echo "ADR válidos"
