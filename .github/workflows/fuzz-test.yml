name: Subscription Contract Fuzzing

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "contracts/subscription/**"
      - "contracts/proxy/**"
      - "contracts/storage/**"
      - "contracts/types/**"
      - "contracts/fuzz/**"
      - ".github/workflows/fuzz-test.yml"
  push:
    branches: [main, develop]
    paths:
      - "contracts/subscription/**"
      - "contracts/proxy/**"
      - "contracts/storage/**"
      - "contracts/types/**"
      - "contracts/fuzz/**"
      - ".github/workflows/fuzz-test.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "Seconds per fuzz target (time-based; ignored when fuzz_runs is set)"
        required: false
        default: "1800"
      fuzz_runs:
        description: "Iteration count per fuzz target (-runs=N). When set, overrides fuzz_seconds."
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FUZZ_SECONDS: ${{ github.event.inputs.fuzz_seconds || '1800' }}
  FUZZ_RUNS: ${{ github.event.inputs.fuzz_runs || '' }}

jobs:
  fuzz:
    name: coverage-guided fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        target:
          - subscription_lifecycle
          - subscription_pricing
          - subscription_rate_limits

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
            contracts/fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('contracts/**/Cargo.lock', 'contracts/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-

      - name: Install cargo-fuzz
        run: |
          if ! command -v cargo-fuzz >/dev/null 2>&1; then
            cargo +nightly install cargo-fuzz --locked
          fi

      - name: Build subscription fuzz smoke test
        run: cargo +nightly test --manifest-path contracts/subscription/Cargo.toml --test fuzz_smoke --no-run

      - name: Run subscription fuzz smoke test
        run: cargo +nightly test --manifest-path contracts/subscription/Cargo.toml --test fuzz_smoke -- --nocapture

      - name: List fuzz targets
        working-directory: contracts
        run: cargo +nightly fuzz list

      - name: Generate seed corpus
        shell: bash
        run: |
          mkdir -p "contracts/fuzz/corpus/${{ matrix.target }}"
          printf "seed:%s:%s\n" "${{ matrix.target }}" "${{ github.sha }}" \
            > "contracts/fuzz/corpus/${{ matrix.target }}/ci-generated.seed"

      - name: Run cargo-fuzz target
        working-directory: contracts
        run: |
          mkdir -p fuzz/artifacts/${{ matrix.target }}
          if [ -n "${FUZZ_RUNS}" ]; then
            LIMIT_FLAG="-runs=${FUZZ_RUNS}"
            echo "Running ${FUZZ_RUNS} iterations (iteration-based)"
          else
            LIMIT_FLAG="-max_total_time=${FUZZ_SECONDS}"
            echo "Running for ${FUZZ_SECONDS}s (time-based)"
          fi
          cargo +nightly fuzz run "${{ matrix.target }}" \
            "fuzz/corpus/${{ matrix.target }}" \
            -- \
            ${LIMIT_FLAG} \
            -artifact_prefix="fuzz/artifacts/${{ matrix.target }}/" \
            -print_final_stats=1

      - name: Upload corpus and crashes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_id }}
          path: |
            contracts/fuzz/corpus/${{ matrix.target }}
            contracts/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  # Stable-toolchain regression replay: deterministically re-runs every crash
  # artifact under contracts/subscription/tests/regressions/ plus a seeded
  # in-process fuzz smoke. Runs on PRs without requiring nightly/libfuzzer.
  regression-replay:
    name: regression replay (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FUZZ_REGRESSION_ITERATIONS: "128"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-fuzz-regression-${{ hashFiles('contracts/**/Cargo.lock', 'contracts/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-

      - name: Replay crash artifacts and seeded fuzz smoke
        run: |
          cargo test --manifest-path contracts/subscription/Cargo.toml \
            --test fuzz_regressions -- --nocapture
