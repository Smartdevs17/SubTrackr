# One ServiceAccount per ml-service workload (#2103). Each is bound to its own
# IAM role via IRSA; the role ARNs come from `terraform output workload_role_arns`
# in ml-service/iam/. Replace ACCOUNT_ID before applying.
# Token automount is off: the pods reach S3 through IRSA web-identity tokens,
# not the default Kubernetes API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-inference
  namespace: subtrackr
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/subtrackr-ml-inference
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-service-api
  namespace: subtrackr
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/subtrackr-ml-service-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-model-trainer
  namespace: subtrackr
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/subtrackr-ml-model-trainer
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-feature-pipeline
  namespace: subtrackr
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/subtrackr-ml-feature-pipeline
automountServiceAccountToken: false
