[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subtrackr-ml-etl"
version = "0.1.0"
description = "Standalone ETL for SubTrackr machine-learning subscription features"
readme = "README.md"
requires-python = ">=3.10"
# The core extract/transform/load engine intentionally uses only the standard
# library. Optional clients for production feature stores live in extras.
dependencies = []

[project.optional-dependencies]
serving = ["numpy>=1.24", "scikit-learn>=1.3"]
storage = ["redis>=4.5", "google-cloud-bigquery>=3.12"]
orchestration = ["apache-airflow>=2.8"]

[project.scripts]
subtrackr-etl = "etl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["etl*"]

[tool.pytest.ini_options]
testpaths = ["etl/tests"]
