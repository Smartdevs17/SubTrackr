# docker-compose.yml
#
# Issue #1175 — Implement local development environment with Docker
#
# Full local development stack for SubTrackr.
# All service ports are driven by COMPOSE_PORT_* variables defined in .env.example.
# Copy .env.example to .env and run ./scripts/setup.sh to get started.
#
# Services:
#   postgres           — PostgreSQL 16 database
#   redis              — Redis 7 (shared: app queues + ML feature store)
#   backend            — Express API server  (port COMPOSE_PORT_BACKEND  = 3000)
#   workers            — BullMQ billing/queue workers (same image, different CMD)
#   webhook-dispatcher — Webhook delivery worker    (same image, different CMD)
#   stellar-standalone — Local Soroban/Stellar node  (port COMPOSE_PORT_SOROBAN = 8000)
#   mobile             — Expo dev server             (port COMPOSE_PORT_EXPO   = 8081)
#   feature-pipeline   — ML feature ingestion pipeline (port 8010)
#   ml-service         — Python anomaly detection service (port COMPOSE_PORT_ML = 8001)
#   seed               — One-shot DB seeder (run with: docker compose run --rm seed)

services:

  # ── Database ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-subtrackr}
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${COMPOSE_PORT_POSTGRES:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-subtrackr}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Cache / Message broker ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${COMPOSE_PORT_REDIS:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── Backend API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    command: ["npx", "tsx", "backend/server/start.ts"]
    environment:
      NODE_ENV:       development
      PORT:           "3000"
      DB_HOST:        postgres
      DB_PORT:        "5432"
      DB_NAME:        ${DB_NAME:-subtrackr}
      DB_USER:        ${DB_USER:-postgres}
      DB_PASSWORD:    ${DB_PASSWORD:-postgres}
      REDIS_HOST:     redis
      REDIS_PORT:     "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB:       ${REDIS_DB:-0}
      SOROBAN_RPC_URL: http://stellar-standalone:8000
    ports:
      - "${COMPOSE_PORT_BACKEND:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── BullMQ Workers ─────────────────────────────────────────────────────────
  workers:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    command: ["npx", "tsx", "backend/workers/start.ts"]
    environment:
      NODE_ENV:       development
      DB_HOST:        postgres
      DB_PORT:        "5432"
      DB_NAME:        ${DB_NAME:-subtrackr}
      DB_USER:        ${DB_USER:-postgres}
      DB_PASSWORD:    ${DB_PASSWORD:-postgres}
      REDIS_HOST:     redis
      REDIS_PORT:     "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB:       ${REDIS_DB:-0}
      WEBHOOK_QUEUE_NAME:         ${WEBHOOK_QUEUE_NAME:-subtrackr:webhooks}
      WEBHOOK_WORKER_CONCURRENCY: ${WEBHOOK_WORKER_CONCURRENCY:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Webhook Dispatcher ─────────────────────────────────────────────────────
  webhook-dispatcher:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    command: ["npx", "tsx", "backend/webhook/dispatcher.ts"]
    environment:
      NODE_ENV:       development
      DB_HOST:        postgres
      DB_PORT:        "5432"
      DB_NAME:        ${DB_NAME:-subtrackr}
      DB_USER:        ${DB_USER:-postgres}
      DB_PASSWORD:    ${DB_PASSWORD:-postgres}
      REDIS_HOST:     redis
      REDIS_PORT:     "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB:       ${REDIS_DB:-0}
      WEBHOOK_QUEUE_NAME:         ${WEBHOOK_QUEUE_NAME:-subtrackr:webhooks}
      WEBHOOK_WORKER_CONCURRENCY: ${WEBHOOK_WORKER_CONCURRENCY:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Stellar / Soroban Standalone Node ──────────────────────────────────────
  stellar-standalone:
    build:
      context: ./docker
      dockerfile: stellar-standalone.Dockerfile
    restart: unless-stopped
    ports:
      - "${COMPOSE_PORT_SOROBAN:-8000}:8000"
      - "11626:11626"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Expo Mobile Dev Server ─────────────────────────────────────────────────
  mobile:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    command: ["npx", "expo", "start", "--dev-client", "--host", "tunnel"]
    environment:
      NODE_ENV: development
      EXPO_DEVTOOLS_LISTEN_ADDRESS: "0.0.0.0"
    ports:
      - "${COMPOSE_PORT_EXPO:-8081}:8081"
      - "19000:19000"
      - "19001:19001"
    depends_on:
      - backend

  # ── ML Feature Pipeline ────────────────────────────────────────────────────
  feature-pipeline:
    build:
      context: .
      dockerfile: services/feature-pipeline/Dockerfile
    restart: unless-stopped
    environment:
      FEATURE_STORE_URL: redis://redis:6379/1
      FEATURE_TTL_SECONDS: "7200"
    ports:
      - "8010:8010"
    depends_on:
      redis:
        condition: service_healthy

  # ── ML Anomaly Detection Service ───────────────────────────────────────────
  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    restart: unless-stopped
    environment:
      FEATURE_STORE_URL:    redis://redis:6379/1
      FEATURE_PIPELINE_PATH: /app/services/feature-pipeline
    ports:
      - "${COMPOSE_PORT_ML:-8001}:8000"
    depends_on:
      redis:
        condition: service_healthy

  # ── DB Seeder (one-shot) ───────────────────────────────────────────────────
  seed:
    build:
      context: .
      dockerfile: docker/seed.Dockerfile
    environment:
      DB_HOST:     postgres
      DB_PORT:     "5432"
      DB_NAME:     ${DB_NAME:-subtrackr}
      DB_USER:     ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    # This service is meant to be run once with:
    #   docker compose run --rm seed
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
